{% extends "base.html" %}
{% block content %}

<style>
  .auth-wrap { display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 120px); padding: 40px 20px; }
  .auth-card { background: var(--bg-secondary); border: 0.5px solid var(--border); border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 400px; }
  .auth-title { font-size: 20px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
  .auth-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 32px; }
  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; letter-spacing: 0.02em; }
  .form-input { width: 100%; padding: 11px 16px; border: 0.5px solid var(--input-border); border-radius: 10px; font-size: 14px; background: var(--input-bg); color: var(--text); font-family: 'Inter', sans-serif; outline: none; transition: border 0.15s; }
  .form-input:focus { border-color: var(--primary); background: var(--bg-secondary); }
  .form-btn { width: 100%; padding: 13px; background: var(--primary); color: #F7F0E3; border: none; border-radius: 10px; font-size: 14px; font-weight: 500; cursor: pointer; margin-top: 8px; font-family: 'Inter', sans-serif; transition: background 0.15s; }
  .form-btn:hover { background: var(--primary-hover); }
  .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-secondary); }
  .auth-footer a { color: var(--primary); font-weight: 500; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 24px 0; }
  .divider-line { flex: 1; height: 0.5px; background: var(--border); }
  .divider-text { font-size: 11px; color: var(--text-muted); }
</style>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-title">Tekrar hoş geldiniz</div>
    <div class="auth-sub">Hesabınıza giriş yapın</div>

    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label">Kullanıcı adı</label>
        <input class="form-input" type="text" name="username" placeholder="kullanici_adi" required />
      </div>
      <div class="form-group">
        <label class="form-label">Şifre</label>
        <input class="form-input" type="password" name="password" placeholder="••••••••" required />
      </div>
      <button class="form-btn" type="submit">Giriş yap</button>
    </form>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">veya</div>
      <div class="divider-line"></div>
    </div>

    <div class="auth-footer">
      Hesabınız yok mu? <a href="/register">Kayıt olun</a>
    </div>
  </div>
</div>

{% endblock %}
